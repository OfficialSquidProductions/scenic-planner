name: Windows installer and verification
on:
  push:
    branches: [main]
    paths: ['dist/**', 'windows/**', 'tests/**', 'tools/**', 'desktop/**', '.github/workflows/windows.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: windows/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Shared model and geometry checks
        shell: pwsh
        run: |
          node tests/geometry.cjs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node tests/catalog.cjs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node tests/model.cjs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node tests/windows-store.cjs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - run: python -m pip install Pillow==11.3.0
      - run: python tools/build_windows.py
      - run: python tools/check_windows.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-verification
          path: release/windows-verification
      - name: Publish tested Windows installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content desktop/release.json | ConvertFrom-Json).version
          $tag = "v$version"
          $exe = 'release/windows/Scenic-Windows-Setup.exe'
          (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower() + '  Scenic-Windows-Setup.exe' | Set-Content release/windows/SHA256-Windows.txt
          gh release view $tag *> $null
          if ($LASTEXITCODE) { gh release create $tag --title "Scenic $version" --notes "Offline scene, shot and lighting planning for Mac and Windows. Windows installer passed packaged-app, installation, saved-workspace, and reinstall checks. See the README for requirements and update details." }
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          gh release upload $tag $exe release/windows/latest.yml release/windows/Scenic-Windows-Setup.exe.blockmap release/windows/SHA256-Windows.txt
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

name: Finalize verified Windows 1.4.29 draft
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify CI and retained Mac assets before publishing
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./tools/publish_windows.ps1 -CandidateSha 24a09c69af4b4a482cb0bb3f2c3ced39591c149b -VerificationRunId 41357595461
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-publication-verification
          path: release/windows-verification

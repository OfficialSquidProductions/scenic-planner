name: Finalize verified Windows 1.4.32 draft
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify CI evidence and publish unchanged VM-tested draft
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./tools/publish_windows.ps1 -CandidateSha b841e4c3b129251ba350b0c592c3197174d5ec35 -VerificationRunId 41388916844
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-publication-verification
          path: release/windows-verification
